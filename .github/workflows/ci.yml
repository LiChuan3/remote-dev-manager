name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (api + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Import smoke test
        run: python -c "import rdm, rdm.api.server; print('ok')"

      - name: Run tests (tolerate no tests)
        run: |
          # pytest exit code 5 == "no tests collected"; treat it as success.
          pytest -q || ([ $? -eq 5 ] && echo "no tests collected — ok")

  frontend:
    name: frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies and build UI (tsc + vite, Tailwind v4 / shadcn)
        working-directory: desktop
        run: |
          npm ci
          npm run build
